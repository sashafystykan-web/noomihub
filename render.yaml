services:
  - type: web
    name: noomihub
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: noomihub-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: MEDIA_DIR
        value: /var/data/noomihub-media
      - key: MODERATOR_TELEGRAM_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
